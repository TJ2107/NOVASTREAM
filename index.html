<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Ignorer les erreurs et logs WebSocket liés au HMR en prévisualisation
      const originalConsoleError = console.error;
      console.error = function(...args) {
        const str = args.map(arg => String(arg)).join(' ');
        if (str.includes('WebSocket') || str.includes('websocket')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };

      window.addEventListener('unhandledrejection', function(event) {
        var msg = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event && event.message ? String(event.message) : '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });

      // Google Cast early hook
      window.__castApiAvailable = false;
      window.__onGCastApiAvailable = function(isAvailable) {
        window.__castApiAvailable = isAvailable;
        if (typeof window.__dispatchGCastApiAvailable === 'function') {
          window.__dispatchGCastApiAvailable(isAvailable);
        }
      };
    </script>
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" defer crossorigin="anonymous"></script>
    <title>NOVASTREAM</title>
    <meta name="description" content="NOVASTREAM - Hub multimédia cosmique & universel pour TV en direct, films VOD, séries et radios." />
